<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pré-evento</title>
<meta name="theme-color" content="#1f5f7a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pré-evento">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest-preevento.json">
<link rel="apple-touch-icon" href="apple-touch-preevento.png">
<link rel="icon" type="image/png" href="preevento-192.png">
<style>
  :root { --bg:#f4f6f7; --panel:#fff; --ink:#1d2a30; --muted:#66757c; --line:#dbe1e4; --accent:#1f5f7a; --accent-dark:#164a60; --soft:#e5f0f4; --warn:#a4442d; --ok:#2f6b4f; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); min-height:100dvh; font-size:16px; }
  button, input, select, textarea { font:inherit; color:inherit; }
  .wrap { max-width:640px; margin:0 auto; padding:max(10px,env(safe-area-inset-top)) 12px max(30px,env(safe-area-inset-bottom)); }
  h1 { font-size:1.25rem; margin:6px 0 10px; }
  label { display:block; font-size:.85rem; color:var(--muted); font-weight:600; margin:12px 0 4px; }
  input[type=text], input[type=search], input[type=tel], input[type=date], input[type=time], select, textarea { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; font-size:16px; }
  textarea { min-height:84px; resize:vertical; }
  .row { display:flex; gap:8px; } .row > * { flex:1; min-width:0; }
  .tabs { display:flex; gap:8px; margin:6px 0 12px; position:sticky; top:0; background:var(--bg); padding:6px 0; z-index:5; }
  .tab { flex:1; padding:10px; border:1px solid var(--line); border-radius:10px; background:#fff; font-weight:700; text-align:center; cursor:pointer; }
  .tab.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:10px; }
  .btn { border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:10px; padding:12px 14px; font-weight:700; cursor:pointer; text-align:center; display:inline-block; text-decoration:none; }
  .btn.sec { background:#fff; color:var(--accent); } .btn.peq { padding:8px 12px; font-size:.9rem; } .btn.perigo { background:#fff; color:var(--warn); border-color:var(--warn); }
  .btn.bloco { width:100%; margin-top:16px; }
  .sug { border:1px solid var(--line); border-radius:10px; background:#fff; margin-top:4px; max-height:220px; overflow-y:auto; display:none; }
  .sug div { padding:11px 12px; border-bottom:1px solid var(--line); cursor:pointer; font-size:.95rem; }
  .sug div:last-child { border-bottom:0; } .sug div:active { background:var(--soft); }
  .sel { font-size:.85rem; color:var(--ok); margin-top:4px; font-weight:600; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .chip { border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 11px; font-size:.85rem; cursor:pointer; }
  .chip.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .extra { background:var(--soft); border-radius:12px; padding:10px; margin-top:10px; }
  .msg { font-size:.9rem; min-height:1.2em; margin-top:10px; font-weight:600; color:var(--ok); } .msg.erro { color:var(--warn); }
  .t1 { font-weight:700; } .t2 { color:var(--muted); font-size:.88rem; margin-top:2px; }
  .badge { display:inline-block; font-size:.74rem; font-weight:700; padding:3px 9px; border-radius:999px; background:#eceae4; color:#444; margin-top:6px; }
  .b1 { background:#f3e3b8; color:#6b4a00; } .b2 { background:#d9e8f7; color:#1d4a75; } .b3 { background:#fbd9d3; color:#8a2a1c; } .b4, .b5 { background:#d6ecdf; color:#1f5a3a; }
  .acoes { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .vazio { text-align:center; color:var(--muted); padding:26px 8px; }
  .link { background:none; border:0; color:var(--accent); font-weight:700; padding:6px 2px; cursor:pointer; }
  #pin { position:fixed; inset:0; background:var(--bg); z-index:50; display:none; align-items:center; justify-content:center; padding:20px; }
  #pin.on { display:flex; }
  #pin .box { background:#fff; border:1px solid var(--line); border-radius:16px; padding:24px 20px; width:100%; max-width:320px; text-align:center; }
  #pinIn { text-align:center; letter-spacing:.5em; font-size:1.6rem; }
  .tsel { display:flex; align-items:center; gap:4px; } .tsel select { padding:11px 6px; text-align:center; }
  .oculto { display:none !important; }
</style>
</head>
<body>

<div id="pin"><div class="box"><h1>Pré-evento</h1><p style="color:var(--muted);margin:0 0 14px">Digite o PIN</p>
  <input id="pinIn" type="tel" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••"><div id="pinMsg" class="msg erro"></div></div></div>

<div class="wrap oculto" id="app">
  <h1>Foto e Vídeo · Pré-evento</h1>
  <div class="tabs"><div class="tab on" id="tabLancar">Lançar</div><div class="tab" id="tabLista">Lançados</div></div>

  <!-- LANÇAR -->
  <div id="viewLancar">
    <div class="card">
      <label style="margin-top:0">Turma</label>
      <input type="search" id="turmaBusca" placeholder="Digite para buscar a turma..." autocomplete="off">
      <div class="sug" id="turmaSug"></div>
      <div class="sel" id="turmaSel"></div>
      <div class="chips" id="comChips"></div>

      <label>Data do evento</label>
      <input type="date" id="data">
      <div class="row"><div><label>Início</label><div id="hIni"></div></div><div><label>Fim</label><div id="hFim"></div></div></div>

      <label>Local</label>
      <input type="search" id="localBusca" placeholder="Digite para buscar o local..." autocomplete="off">
      <div class="sug" id="localSug"></div>
      <div class="sel" id="localSel"></div>
      <button class="link" id="novoLocalBtn">+ Novo local</button>

      <label>Nome do contato da comissão</label>
      <input type="text" id="contato" placeholder="Escolha acima ou digite">
      <label>WhatsApp do contato</label>
      <input type="tel" id="whats" inputmode="tel" placeholder="Com DDD">

      <label>Outras turmas neste mesmo evento (opcional)</label>
      <input type="search" id="extraBusca" placeholder="Digite para adicionar outra turma..." autocomplete="off">
      <div class="sug" id="extraSug"></div>
      <div id="extras"></div>

      <label>Observações</label>
      <textarea id="obs" placeholder="Detalhes do evento, combinados, etc."></textarea>
      <div class="msg" id="msgLancar"></div>
      <button class="btn bloco" id="salvar">Lançar pré-evento</button>
    </div>
  </div>

  <!-- LANÇADOS -->
  <div id="viewLista" class="oculto">
    <div class="row" style="margin-bottom:10px">
      <select id="filtro"><option value="prox">Próximos</option><option value="pass">Já realizados</option><option value="todos">Todos</option></select>
      <button class="btn sec peq" id="atualizar" style="flex:0 0 auto">Atualizar</button>
    </div>
    <div class="msg" id="msgLista"></div>
    <div id="lista"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  var SUPABASE_URL = 'https://gqgxekjcmnostlxgfvlg.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_UBuz0ZvBKbFmGR9JCNCwEw_nlo4xIDc';
  var PIN = '7085';
  var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var turmas = [], locais = [], eventos = [], editando = null, salvando = false;
  var turmaSel = null, localSel = null, extras = [];
  var DIAS = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function norm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function hojeISO() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function fmtData(s) { if (!s) return ''; var p = String(s).slice(0, 10).split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2]); return DIAS[d.getDay()] + ' ' + p[2] + '/' + p[1] + '/' + p[0]; }
  function hh(t) { return t ? String(t).slice(0, 5) : ''; }
  function normWhats(raw) {
    var d = String(raw || '').replace(/\D/g, ''); if (!d) return null;
    if (d.indexOf('55') === 0 && (d.length === 12 || d.length === 13)) return d;
    if (d.length === 11) return '55' + d; if (d.length === 9) return '5548' + d; if (d.length === 8) return '55489' + d;
    return '55' + d;
  }
  function fmtWhats(w) {
    var d = String(w || '').replace(/\D/g, '');
    if (d.indexOf('55') === 0 && d.length === 13) return '(' + d.slice(2, 4) + ') ' + d.slice(4, 9) + '-' + d.slice(9);
    if (d.indexOf('55') === 0 && d.length === 12) return '(' + d.slice(2, 4) + ') ' + d.slice(4, 8) + '-' + d.slice(8);
    return w || '';
  }

  /* seletor de horário (dois menus: hora e minuto), no lugar do relógio do navegador que cortava o botão OK */
  function tHtml(attrs, val) {
    var v = String(val || '').slice(0, 5), h = v.slice(0, 2), m = v.slice(3, 5), o = '<option value="">--</option>', i, x;
    var hs = o, ms = o;
    for (i = 0; i < 24; i++) { x = String(i).padStart(2, '0'); hs += '<option' + (x === h ? ' selected' : '') + '>' + x + '</option>'; }
    var mins = ['00', '05', '10', '15', '20', '25', '30', '35', '40', '45', '50', '55']; if (m && mins.indexOf(m) < 0) mins.push(m), mins.sort();
    mins.forEach(function (y) { ms += '<option' + (y === m ? ' selected' : '') + '>' + y + '</option>'; });
    return '<div class="tsel" ' + attrs + '><select data-p="h">' + hs + '</select>:<select data-p="m">' + ms + '</select></div>';
  }
  function tVal(el) { var h = el.querySelector('[data-p=h]').value, m = el.querySelector('[data-p=m]').value; if (!h) return ''; return h + ':' + (m || '00'); }
  function tSet(el, v) { v = String(v || ''); el.querySelector('[data-p=h]').value = v.slice(0, 2); el.querySelector('[data-p=m]').value = v ? v.slice(3, 5) : ''; }
  function setMsg(id, t, erro) { var m = $(id); m.textContent = t || ''; m.className = 'msg' + (erro ? ' erro' : ''); }

  /* ---------- PIN ---------- */
  function montarHoras() { $('hIni').outerHTML = tHtml('id="hIni"', ''); $('hFim').outerHTML = tHtml('id="hFim"', ''); }
  montarHoras();
  function iniciar() {
    if (lsGet('peOk') === '1') { entrar(); return; }
    $('pin').classList.add('on'); $('pinIn').focus();
  }
  function entrar() { $('pin').classList.remove('on'); $('app').classList.remove('oculto'); carregar(); }
  $('pinIn').addEventListener('input', function () {
    var v = this.value.replace(/\D/g, ''); this.value = v;
    if (v.length === 4) { if (v === PIN) { lsSet('peOk', '1'); entrar(); } else { $('pinMsg').textContent = 'PIN incorreto.'; this.value = ''; } }
    else $('pinMsg').textContent = '';
  });

  /* ---------- Carga ---------- */
  async function mapa(tab, id, nome) { var r = await db.from(tab).select(id + ', ' + nome); var m = {}; (r.data || []).forEach(function (x) { m[x[id]] = x[nome]; }); return m; }
  async function carregar() {
    try {
      var res = await Promise.all([
        db.from('FormTurma').select('idTurma, IdFaculdade, IdCurso, IdTurno, IdSemestre, Identificacao').eq('Condicao', 'Imaginarium'),
        mapa('FormFaculdade', 'IdFaculdade', 'NomeFaculdade'), mapa('FormCurso', 'idCurso', 'NomeCurso'),
        mapa('FormTurno', 'idturno', 'NomeTurno'), mapa('FormSemestre', 'idSemestre', 'NomeSemestre'),
        db.from('FormLocalPreEvento').select('idLocalPreEvento, NomeLocal, Endereco').order('NomeLocal')
      ]);
      if (res[0].error) throw res[0].error;
      var mf = res[1], mc = res[2], mt = res[3], ms = res[4];
      window._mapas = { mf: mf, mc: mc, mt: mt, ms: ms };
      turmas = (res[0].data || []).map(function (t) {
        var id = t.Identificacao ? String(t.Identificacao).trim() : '', cur = mc[t.IdCurso] || '—';
        if (id) cur += ' (' + (id.length <= 2 ? 'Turma ' + id : id) + ')';
        var tx = (mf[t.IdFaculdade] || '—') + ' - ' + cur + ' - ' + (mt[t.IdTurno] || '—') + ' - ' + (ms[t.IdSemestre] || '—');
        return { id: t.idTurma, texto: tx, n: norm(tx) };
      }).sort(function (a, b) { return a.texto.localeCompare(b.texto, 'pt-BR'); });
      locais = (res[5].data || []).map(function (l) { return { id: l.idLocalPreEvento, nome: l.NomeLocal, end: l.Endereco, n: norm(l.NomeLocal) }; });
    } catch (e) { setMsg('msgLancar', 'Erro ao carregar: ' + (e.message || e), true); }
  }

  /* ---------- Abas ---------- */
  function aba(qual) {
    $('tabLancar').classList.toggle('on', qual === 'lancar'); $('tabLista').classList.toggle('on', qual === 'lista');
    $('viewLancar').classList.toggle('oculto', qual !== 'lancar'); $('viewLista').classList.toggle('oculto', qual !== 'lista');
    if (qual === 'lista') carregarLista();
  }
  $('tabLancar').addEventListener('click', function () { aba('lancar'); });
  $('tabLista').addEventListener('click', function () { aba('lista'); });

  /* ---------- Busca genérica ---------- */
  function buscar(inputId, sugId, fonte, onPick, excluir) {
    var inp = $(inputId), sug = $(sugId);
    inp.addEventListener('input', function () {
      var t = norm(inp.value.trim());
      if (inputId === 'turmaBusca') { turmaSel = null; $('turmaSel').textContent = ''; $('comChips').innerHTML = ''; }
      if (inputId === 'localBusca') { localSel = null; $('localSel').textContent = ''; }
      if (!t) { sug.style.display = 'none'; sug.innerHTML = ''; return; }
      var ps = t.split(/\s+/).filter(Boolean), usados = excluir ? excluir() : [];
      var r = fonte().filter(function (x) { return usados.indexOf(x.id) < 0 && ps.every(function (p) { return x.n.indexOf(p) >= 0; }); }).slice(0, 20);
      sug.innerHTML = r.length ? r.map(function (x) { return '<div data-id="' + x.id + '">' + esc(x.texto || x.nome) + '</div>'; }).join('') : '<div style="color:#66757c">Nada encontrado.</div>';
      sug.style.display = 'block';
    });
    sug.addEventListener('click', function (e) {
      var d = e.target.closest('[data-id]'); if (!d) return;
      var x = fonte().filter(function (y) { return String(y.id) === d.getAttribute('data-id'); })[0];
      sug.style.display = 'none'; onPick(x);
    });
  }
  function usadas() { var u = extras.map(function (x) { return x.id; }); if (turmaSel) u.push(turmaSel.id); return u; }

  async function membros(idTurma) {
    var r = await db.from('FormFormando').select('idFormando, FormandoNome, FormandoSobrenome, Whats').eq('IdTurma', idTurma).eq('FormAtivo', true).eq('Comissao', true).order('FormandoNome', { ascending: true });
    return (r.data || []).map(function (f) { return { id: f.idFormando, nome: [f.FormandoNome, f.FormandoSobrenome].filter(Boolean).join(' ').trim(), whats: f.Whats || '' }; }).filter(function (m) { return m.nome; });
  }
  function chipsHtml(ms, ativoId) { return ms.map(function (m) { return '<span class="chip' + (m.id === ativoId ? ' on' : '') + '" data-m="' + m.id + '">' + esc(m.nome) + '</span>'; }).join(''); }

  /* turma principal */
  var comMembros = [];
  buscar('turmaBusca', 'turmaSug', function () { return turmas; }, async function (t) {
    turmaSel = t; $('turmaBusca').value = t.texto; $('turmaSel').textContent = 'Turma selecionada';
    $('contato').value = ''; $('whats').value = ''; $('comChips').innerHTML = '<span style="color:#66757c;font-size:.85rem">Buscando formandos...</span>';
    comMembros = await membros(t.id);
    if (!comMembros.length) { $('comChips').innerHTML = '<span style="color:#66757c;font-size:.85rem">Ninguém da comissão cadastrado nesta turma. Preencha o contato.</span>'; return; }
    if (comMembros.length === 1) { $('comChips').innerHTML = ''; pick(comMembros[0]); return; }
    $('comChips').innerHTML = chipsHtml(comMembros, null);
  });
  function pick(m) { $('contato').value = m.nome; $('whats').value = m.whats; Array.prototype.forEach.call($('comChips').children, function (c) { c.classList.toggle('on', c.getAttribute('data-m') === String(m.id)); }); }
  $('comChips').addEventListener('click', function (e) { var c = e.target.closest('[data-m]'); if (!c) return; pick(comMembros.filter(function (m) { return String(m.id) === c.getAttribute('data-m'); })[0]); });

  /* local */
  buscar('localBusca', 'localSug', function () { return locais; }, function (l) { localSel = l; $('localBusca').value = l.nome; $('localSel').textContent = 'Local selecionado'; });
  $('novoLocalBtn').addEventListener('click', async function () {
    var nome = prompt('Nome do novo local:'); if (!nome || !nome.trim()) return;
    var r = await db.from('FormLocalPreEvento').insert({ NomeLocal: nome.trim() }).select().single();
    if (r.error) return setMsg('msgLancar', 'Erro ao cadastrar o local: ' + r.error.message, true);
    var l = { id: r.data.idLocalPreEvento, nome: r.data.NomeLocal, end: null, n: norm(r.data.NomeLocal) };
    locais.push(l); localSel = l; $('localBusca').value = l.nome; $('localSel').textContent = 'Local selecionado'; setMsg('msgLancar', 'Local cadastrado.');
  });

  /* outras turmas */
  buscar('extraBusca', 'extraSug', function () { return turmas; }, async function (t) {
    $('extraBusca').value = '';
    var ex = { id: t.id, texto: t.texto, ini: '', fim: '', contato: '', whats: '', ms: [] };
    extras.push(ex); renderExtras();
    ex.ms = await membros(t.id);
    if (ex.ms.length === 1) { ex.contato = ex.ms[0].nome; ex.whats = ex.ms[0].whats; }
    renderExtras();
  }, usadas);
  function renderExtras() {
    $('extras').innerHTML = extras.map(function (x, i) {
      return '<div class="extra" data-i="' + i + '"><div class="t1">' + esc(x.texto) + '</div>' +
        '<div class="row"><div><label>Início</label>' + tHtml('data-k="ini"', x.ini) + '</div><div><label>Fim</label>' + tHtml('data-k="fim"', x.fim) + '</div></div>' +
        (x.ms.length > 1 ? '<div class="chips">' + chipsHtml(x.ms, (x.ms.filter(function (m) { return m.nome === x.contato; })[0] || {}).id) + '</div>' : '') +
        '<label>Contato</label><input type="text" data-k="contato" value="' + esc(x.contato) + '"><label>WhatsApp</label><input type="tel" data-k="whats" value="' + esc(x.whats) + '">' +
        '<button class="link" data-rm="1" style="color:var(--warn)">Remover esta turma</button></div>';
    }).join('');
  }
  $('extras').addEventListener('input', function (e) { var b = e.target.closest('[data-i]'); var kEl = e.target.closest('[data-k]'); if (!b || !kEl) return; var k = kEl.getAttribute('data-k'); extras[+b.getAttribute('data-i')][k] = kEl.classList.contains('tsel') ? tVal(kEl) : e.target.value; });
  $('extras').addEventListener('click', function (e) {
    var b = e.target.closest('[data-i]'); if (!b) return; var x = extras[+b.getAttribute('data-i')];
    if (e.target.getAttribute('data-rm')) { extras.splice(+b.getAttribute('data-i'), 1); return renderExtras(); }
    var c = e.target.closest('[data-m]'); if (c) { var m = x.ms.filter(function (y) { return String(y.id) === c.getAttribute('data-m'); })[0]; x.contato = m.nome; x.whats = m.whats; renderExtras(); }
  });

  /* salvar */
  $('salvar').addEventListener('click', async function () {
    if (salvando) return;
    var data = $('data').value, ini = tVal($('hIni')), fim = tVal($('hFim')), contato = $('contato').value.trim(), whats = $('whats').value.trim(), obs = $('obs').value.trim();
    if (!turmaSel || !data || !contato || !whats) return setMsg('msgLancar', 'Preencha turma, data, nome do contato e WhatsApp.', true);
    if (ini && fim && fim <= ini) return setMsg('msgLancar', 'O horário de fim precisa ser depois do início.', true);
    for (var i = 0; i < extras.length; i++) {
      var x = extras[i];
      if (!x.contato.trim() || !x.whats.trim()) return setMsg('msgLancar', 'Preencha contato e WhatsApp de: ' + x.texto, true);
      if (x.ini && x.fim && x.fim <= x.ini) return setMsg('msgLancar', 'Fim antes do início em: ' + x.texto, true);
    }
    salvando = true; $('salvar').disabled = true; setMsg('msgLancar', 'Salvando...');
    try {
      var idSessao = null;
      if (extras.length) {
        var s = await db.from('FormSessaoCobertura').insert({ Tipo: 'Pré-evento', DataSessao: data }).select().single();
        if (s.error) throw s.error; idSessao = s.data.idSessao;
      }
      var base = { DataEvento: data, IdLocalPreEvento: localSel ? Number(localSel.id) : null, Observacoes: obs || null, IdSessao: idSessao };
      var linhas = [Object.assign({}, base, { IdTurma: Number(turmaSel.id), HorarioEvento: ini || null, HorarioFimEvento: fim || null, NomeContatoComissao: contato, WhatsContatoComissao: normWhats(whats) })]
        .concat(extras.map(function (x) { return Object.assign({}, base, { IdTurma: Number(x.id), HorarioEvento: x.ini || null, HorarioFimEvento: x.fim || null, NomeContatoComissao: x.contato.trim(), WhatsContatoComissao: normWhats(x.whats) }); }));
      var r = await db.from('FormPreEvento').insert(linhas);
      if (r.error) throw r.error;
      setMsg('msgLancar', 'Pré-evento lançado (' + linhas.length + ' turma' + (linhas.length > 1 ? 's' : '') + ').');
      limpar();
    } catch (e) { setMsg('msgLancar', 'Erro ao lançar: ' + (e.message || e), true); }
    salvando = false; $('salvar').disabled = false;
  });
  function limpar() {
    turmaSel = null; localSel = null; extras = []; comMembros = [];
    ['turmaBusca', 'data', 'localBusca', 'contato', 'whats', 'extraBusca', 'obs'].forEach(function (id) { $(id).value = ''; });
    $('turmaSel').textContent = ''; $('localSel').textContent = ''; $('comChips').innerHTML = ''; renderExtras(); tSet($('hIni'), ''); tSet($('hFim'), ''); window.scrollTo(0, 0);
  }

  /* ---------- Lista / correção ---------- */
  function terminou(e) {
    var fimStr = hh(e.HorarioFimEvento) || hh(e.HorarioEvento) || '23:59';
    var p = String(e.DataEvento).slice(0, 10).split('-'), h = fimStr.split(':');
    return new Date(+p[0], +p[1] - 1, +p[2], +h[0], +h[1]) < new Date();
  }
  function fase(e) {
    if (!e.DataConfirmacaoFotoVideo) return [1, 'Aguardando confirmação da cobertura'];
    if (!e.LinkFotos) return terminou(e) ? [3, 'Aguardando anexar o link das fotos'] : [2, 'Confirmado — aguardando o evento'];
    if (!e.DataEncaminhadoComissao) return [4, 'Link anexado — aguardando encaminhar'];
    return [5, 'Concluído'];
  }
  async function carregarLista() {
    setMsg('msgLista', 'Carregando...'); $('lista').innerHTML = '';
    var r = await db.from('FormPreEvento').select('*').neq('Ativo', false).order('DataEvento', { ascending: true });
    if (r.error) return setMsg('msgLista', 'Erro: ' + r.error.message, true);
    eventos = (r.data || []).filter(function (e) { return e.IdEntidade == null; });
    setMsg('msgLista', ''); renderLista();
  }
  $('filtro').addEventListener('change', renderLista);
  $('atualizar').addEventListener('click', carregarLista);
  function turmaTxt(id) { var t = turmas.filter(function (x) { return x.id === id; })[0]; return t ? t.texto : 'Turma #' + id; }
  function localTxt(id) { var l = locais.filter(function (x) { return x.id === id; })[0]; return l ? l.nome + (l.end ? ' — ' + l.end : '') : ''; }
  function renderLista() {
    var f = $('filtro').value, hoje = hojeISO();
    var lista = eventos.filter(function (e) { var d = String(e.DataEvento).slice(0, 10); return f === 'todos' ? true : f === 'prox' ? !terminou(e) : terminou(e); });
    lista.sort(function (a, b) { var k = String(a.DataEvento).localeCompare(String(b.DataEvento)) || hh(a.HorarioEvento).localeCompare(hh(b.HorarioEvento)); return f === 'pass' ? -k : k; });
    if (!lista.length) { $('lista').innerHTML = '<div class="vazio">Nenhum pré-evento aqui.</div>'; return; }
    $('lista').innerHTML = lista.map(function (e) {
      var fs = fase(e);
      if (editando === e.idPreEvento) return cardEdicao(e);
      var h = hh(e.HorarioEvento) ? hh(e.HorarioEvento) + (hh(e.HorarioFimEvento) ? '–' + hh(e.HorarioFimEvento) : '') : 'sem horário';
      return '<div class="card" data-id="' + e.idPreEvento + '"><div class="t1">' + esc(fmtData(e.DataEvento)) + ' · ' + esc(h) + '</div>' +
        '<div class="t2" style="color:var(--ink)">' + esc(turmaTxt(e.IdTurma)) + '</div>' +
        (e.IdLocalPreEvento ? '<div class="t2">Local: ' + esc(localTxt(e.IdLocalPreEvento)) + '</div>' : '') +
        (e.NomeContatoComissao ? '<div class="t2">Comissão: ' + esc(e.NomeContatoComissao) + (e.WhatsContatoComissao ? ' · ' + esc(fmtWhats(e.WhatsContatoComissao)) : '') + '</div>' : '') +
        (e.NomeFotografo ? '<div class="t2">Fotógrafo: ' + esc(e.NomeFotografo) + '</div>' : '') +
        (e.Observacoes ? '<div class="t2">Obs: ' + esc(e.Observacoes) + '</div>' : '') +
        (e.IdSessao ? '<div class="t2">Evento com várias turmas</div>' : '') +
        '<span class="badge b' + fs[0] + '">' + esc(fs[1]) + '</span>' +
        '<div class="acoes"><button class="btn sec peq" data-a="edit">Corrigir</button>' +
        (e.WhatsContatoComissao ? '<a class="btn sec peq" target="_blank" rel="noopener" href="https://wa.me/' + esc(String(e.WhatsContatoComissao).replace(/\D/g, '')) + '">WhatsApp</a>' : '') +
        '<button class="btn perigo peq" data-a="cancel">Cancelar evento</button></div></div>';
    }).join('');
  }
  function cardEdicao(e) {
    var outros = e.IdSessao ? eventos.filter(function (x) { return x.IdSessao === e.IdSessao && x.idPreEvento !== e.idPreEvento; }).length : 0;
    return '<div class="card" data-id="' + e.idPreEvento + '"><div class="t1">Corrigir pré-evento</div><div class="t2">' + esc(turmaTxt(e.IdTurma)) + '</div>' +
      '<label>Data</label><input type="date" data-k="data" value="' + esc(String(e.DataEvento).slice(0, 10)) + '">' +
      '<div class="row"><div><label>Início</label>' + tHtml('data-k="ini"', hh(e.HorarioEvento)) + '</div><div><label>Fim</label>' + tHtml('data-k="fim"', hh(e.HorarioFimEvento)) + '</div></div>' +
      '<label>Local</label><select data-k="local"><option value="">Nenhum</option>' + locais.map(function (l) { return '<option value="' + l.id + '"' + (l.id === e.IdLocalPreEvento ? ' selected' : '') + '>' + esc(l.nome) + '</option>'; }).join('') + '</select>' +
      '<label>Contato da comissão</label><input type="text" data-k="contato" value="' + esc(e.NomeContatoComissao || '') + '">' +
      '<label>WhatsApp</label><input type="tel" data-k="whats" value="' + esc(e.WhatsContatoComissao || '') + '">' +
      '<label>Observações</label><textarea data-k="obs">' + esc(e.Observacoes || '') + '</textarea>' +
      (outros ? '<label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" data-k="sair" style="width:auto"> Tirar desta sessão (fica sozinho, com data e horário próprios)</label><div class="t2">Esta sessão tem mais ' + outros + ' turma(s). Mudar a data aqui só vale para esta turma se você marcar acima.</div>' : '') +
      '<div class="acoes"><button class="btn" data-a="save">Salvar</button><button class="btn sec" data-a="cancelEdit">Voltar</button></div><div class="msg" data-msg="1"></div></div>';
  }
  $('lista').addEventListener('click', async function (ev) {
    var b = ev.target.closest('[data-a]'); if (!b) return;
    var card = b.closest('[data-id]'), id = Number(card.getAttribute('data-id')), e = eventos.filter(function (x) { return x.idPreEvento === id; })[0], a = b.getAttribute('data-a');
    if (a === 'edit') { editando = id; return renderLista(); }
    if (a === 'cancelEdit') { editando = null; return renderLista(); }
    if (a === 'cancel') {
      if (!confirm('Cancelar este pré-evento?\n' + turmaTxt(e.IdTurma) + '\n' + fmtData(e.DataEvento) + '\n\nEle sai das listas (fica guardado como inativo).')) return;
      var r = await db.from('FormPreEvento').update({ Ativo: false }).eq('idPreEvento', id);
      if (r.error) return setMsg('msgLista', 'Erro ao cancelar: ' + r.error.message, true);
      eventos = eventos.filter(function (x) { return x.idPreEvento !== id; }); setMsg('msgLista', 'Pré-evento cancelado.'); return renderLista();
    }
    if (a === 'save') {
      var q = function (k) { return card.querySelector('[data-k=' + k + ']'); };
      var data = q('data').value, ini = tVal(q('ini')), fim = tVal(q('fim')), msgEl = card.querySelector('[data-msg]');
      if (!data) { msgEl.className = 'msg erro'; msgEl.textContent = 'Preencha a data.'; return; }
      if (ini && fim && fim <= ini) { msgEl.className = 'msg erro'; msgEl.textContent = 'O fim precisa ser depois do início.'; return; }
      var sair = q('sair') && q('sair').checked;
      if (e.IdSessao && !sair && data !== String(e.DataEvento).slice(0, 10)) { msgEl.className = 'msg erro'; msgEl.textContent = 'Esta turma está numa sessão com outras. Para mudar a data, marque "Tirar desta sessão".'; return; }
      var upd = { DataEvento: data, HorarioEvento: ini || null, HorarioFimEvento: fim || null, IdLocalPreEvento: q('local').value ? Number(q('local').value) : null,
        NomeContatoComissao: q('contato').value.trim() || null, WhatsContatoComissao: normWhats(q('whats').value), Observacoes: q('obs').value.trim() || null };
      if (sair) upd.IdSessao = null;
      b.disabled = true;
      var r2 = await db.from('FormPreEvento').update(upd).eq('idPreEvento', id);
      if (r2.error) { b.disabled = false; msgEl.className = 'msg erro'; msgEl.textContent = 'Erro ao salvar: ' + r2.error.message; return; }
      Object.assign(e, { DataEvento: data, HorarioEvento: upd.HorarioEvento, HorarioFimEvento: upd.HorarioFimEvento, IdLocalPreEvento: upd.IdLocalPreEvento, NomeContatoComissao: upd.NomeContatoComissao, WhatsContatoComissao: upd.WhatsContatoComissao, Observacoes: upd.Observacoes });
      if (sair) e.IdSessao = null;
      editando = null; setMsg('msgLista', 'Pré-evento corrigido.'); renderLista();
    }
  });

  document.addEventListener('click', function (e) { if (!e.target.closest('.sug') && !e.target.matches('input[type=search]')) Array.prototype.forEach.call(document.querySelectorAll('.sug'), function (s) { s.style.display = 'none'; }); });
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }
  iniciar();
})();
</script>
</body>
</html>
