<script>
/* Imaginarium — Tarefas do dia a dia (fila por setor, tarefas com etapas).
   Uso: TF.init({ raiz: 'idDoElemento', setorId: 5, admin: true }); depois TF.abrir('fila' | 'acomp' | 'setores' | 'hist').
   Precisa de: supabaseClient (global). Tabelas: FormTarefa, FormTarefaEtapa, view FormTarefaEtapaVw, FormSetor, FormTurma... */
(function () {
  'use strict';
  var TF = window.TF = {};
  var C = { raiz: null, setorId: 5, admin: false };
  var S = { sel: {}, aba: 'fila', setores: [], setorMap: {}, tarefas: {}, etapas: [], turmaRot: {}, turmaIdPorRot: {}, colacoes: [], colRot: {}, base: false, modo: 'simples', maisAberto: false, detalheId: null, edEtapa: null, filtroSetor: '', verParadas: false };

  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var $ = function (id) { return document.getElementById(id); };
  var db = function () { return window.supabaseClient || (typeof supabaseClient !== 'undefined' ? supabaseClient : null); };

  var CSS = '\
.tf{background:var(--panel,#fff);color:var(--ink,#1f2a24);border:1px solid var(--line,#dfe0da);border-radius:14px;padding:36px 32px;min-height:420px;font-family:inherit;position:relative}\

.tf-aba{background:#f6f5f2;color:#1f2a24;border:1px solid #dfe0da;border-radius:20px;padding:6px 14px;font-size:.88rem;cursor:pointer;font-family:inherit}\
.tf-aba.on{background:#2f6b4f;color:#fff;border-color:#2f6b4f;font-weight:600}\
.tf-add{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}\
.tf-add input[type=text]{flex:1;min-width:180px;background:#ffffff;border:1px solid #dfe0da;color:#1f2a24;border-radius:10px;padding:10px 12px;font-size:1rem;font-family:inherit}\
.tf-modo{display:flex;border:1px solid #dfe0da;border-radius:10px;overflow:hidden}\
.tf-modo button{background:#ffffff;color:#6b7570;border:none;padding:9px 12px;font-size:.82rem;cursor:pointer;font-family:inherit}\
.tf-modo button.on{background:#e4efe9;color:#234f3a;font-weight:600}\
.tf-btn{background:#2f6b4f;color:#ffffff;border:none;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;font-family:inherit;font-size:.9rem}\
.tf-btn2{background:#f6f5f2;color:#1f2a24;border:1px solid #dfe0da;border-radius:10px;padding:8px 13px;cursor:pointer;font-family:inherit;font-size:.85rem}\
.tf-btn2.perigo{color:#b3261e;border-color:#e5b9b3}\
.tf-sug{margin-top:4px}.tf-sug button{display:block;width:100%;text-align:left;padding:11px 12px;background:#fff;border:1px solid #dfe0da;border-top:none;font-size:.92rem;font-family:inherit;color:#1f2a24;cursor:pointer}.tf-sug button:first-child{border-top:1px solid #dfe0da;border-radius:8px 8px 0 0}.tf-sug button:last-child{border-radius:0 0 8px 8px}.tf-sug button:only-child{border-radius:8px}\
.tf-lnk{background:none;border:none;color:#2f6b4f;cursor:pointer;font-size:.82rem;padding:2px 0;font-family:inherit;text-decoration:underline}\
.tf-mais{background:#f6f5f2;border:1px solid #dfe0da;border-radius:10px;padding:10px;margin:6px 0 10px;display:grid;gap:8px}\
.tf-mais label,.tf-dlg label{font-size:.78rem;color:#6b7570;display:block;margin-bottom:3px}\
.tf input[type=text],.tf textarea,.tf select,.tf input[type=date],.tf-dlg input[type=text],.tf-dlg textarea,.tf-dlg select{width:100%;background:#ffffff;border:1px solid #dfe0da;color:#1f2a24;border-radius:8px;padding:8px 10px;font-size:.92rem;font-family:inherit}\
.tf textarea,.tf-dlg textarea{resize:vertical;min-height:62px}\
.tf-item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #e6e8e3;background:#ffffff}\

.tf-circ{flex:0 0 26px;width:26px;height:26px;border-radius:50%;border:2px solid #9aa39d;background:none;cursor:pointer;padding:0}\
.tf-circ:hover{border-color:#2f6b4f;background:#2f6b4f22}\
.tf-corpo{flex:1;min-width:0;cursor:pointer}\
.tf-tit{font-size:1.02rem;line-height:1.3}\
.tf-sub{font-size:.78rem;color:#6b7570;margin-top:2px}\
.tf-ico{background:none;border:none;color:#6b7570;cursor:pointer;font-size:1.15rem;padding:4px 6px}\
.tf-ico:hover{color:#2f6b4f}\
.tf-alca{color:#9aa39d;font-size:1.25rem;cursor:grab;padding:4px 8px;touch-action:none;user-select:none}\
.tf-vazio{color:#8a928d;padding:22px 4px;font-size:.92rem}\
.tf-cont{color:#6b7570;font-size:.85rem;margin:2px 0 8px}\

.tf-chip.ok{background:#dcebe1;color:#1d3d2b}.tf-chip.esp{background:#e6e8e3;color:#6b7570}.tf-chip.atr{background:#f6dedb;color:#8a2f25}\
.tf-card{background:#f6f5f2;border:1px solid #dfe0da;border-radius:12px;padding:12px 14px;margin-bottom:10px}\
.tf-barra{height:6px;background:#dfe0da;border-radius:4px;overflow:hidden;margin:8px 0}\
.tf-barra>i{display:block;height:100%;background:#2f6b4f}\
.tf-passos{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}\
.tf-dia{font-size:.78rem;color:#2f6b4f;margin:16px 0 4px}\
.tf-ov{position:fixed;inset:0;background:#0007;z-index:400;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}\
.tf-ov.show{display:flex}\
.tf-dlg{background:#ffffff;color:#1f2a24;border:1px solid #dfe0da;border-radius:14px;width:min(640px,100%);padding:18px;position:relative}\
.tf-dlg h2{margin:0 0 4px;color:var(--ink,#1f2a24);font-size:1.25rem;padding-right:28px}\
.tf-x{position:absolute;right:12px;top:10px;background:none;border:none;color:#6b7570;font-size:1.3rem;cursor:pointer}\
.tf-row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}\
.tf-et{border:1px solid #dfe0da;border-radius:10px;padding:10px;margin:8px 0;background:#f6f5f2}\
.tf-et.lib{border-color:#2f6b4f}\
.tf-et.fim{opacity:.6}\
.tf-form-et{border:1px dashed #c9cdc7;border-radius:10px;padding:10px;margin:8px 0;display:grid;gap:6px}\
.tf-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2f6b4f;color:#ffffff;padding:9px 16px;border-radius:10px;z-index:500;font-weight:600;display:none}\
.tf-toast.erro{background:#b3261e}\
@media(max-width:600px){.tf{padding:20px 16px}.tf-row2{grid-template-columns:1fr}.tf-dlg{padding:14px}}';

  // ---------- utilidades ----------
  function toast(msg, erro) {
    var t = $('tfToast'); if (!t) return;
    t.textContent = msg; t.className = 'tf-toast' + (erro ? ' erro' : ''); t.style.display = 'block';
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = 'none'; }, erro ? 5000 : 2200);
  }
  async function todos(tabela, sel, ord) {
    var out = [], from = 0;
    for (;;) {
      var q = db().from(tabela).select(sel).order(ord || 'id').range(from, from + 999);
      var r = await q;
      if (r.error) throw r.error;
      out = out.concat(r.data || []);
      if (!r.data || r.data.length < 1000) break;
      from += 1000;
    }
    return out;
  }
  function dataBR(iso) { if (!iso) return ''; var p = String(iso).slice(0, 10).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  function diaLocal(ts) { var d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function horaLocal(ts) { var d = new Date(ts); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  function dias(ts) { return Math.floor((Date.now() - new Date(ts).getTime()) / 86400000); }
  function nomeSetor(id) { return S.setorMap[id] || 'Setor ' + id; }
  function ehDono(t) { return Number(t.IdSetorDono) === Number(C.setorId); }

  // ---------- carga ----------
  async function carregarBase() {
    if (S.base) return;
    var res = await Promise.all([
      db().from('FormSetor').select('idSetor, NomeSetor').order('idSetor'),
      todos('FormTurma', 'idTurma, IdFaculdade, IdCurso, IdSemestre, Identificacao, IdColacao', 'idTurma'),
      db().from('FormFaculdade').select('IdFaculdade, NomeFaculdade'),
      db().from('FormCurso').select('idCurso, NomeCurso'),
      db().from('FormSemestre').select('idSemestre, NomeSemestre'),
      db().from('FormColacao').select('idColacao, DataColacao')
    ]);
    S.setores = res[0].data || [];
    S.setorMap = {}; S.setores.forEach(function (s) { S.setorMap[s.idSetor] = s.NomeSetor; });
    var fac = {}, cur = {}, sem = {};
    (res[2].data || []).forEach(function (x) { fac[x.IdFaculdade] = x.NomeFaculdade; });
    (res[3].data || []).forEach(function (x) { cur[x.idCurso] = x.NomeCurso; });
    (res[4].data || []).forEach(function (x) { sem[x.idSemestre] = x.NomeSemestre; });
    S.turmaRot = {}; S.turmaIdPorRot = {};
    var porCol = {};
    res[1].forEach(function (t) {
      var r = [fac[t.IdFaculdade], cur[t.IdCurso] + (t.Identificacao ? ' (' + (String(t.Identificacao).length <= 2 ? 'Turma ' + t.Identificacao : t.Identificacao) + ')' : ''), sem[t.IdSemestre]].filter(Boolean).join(' - ');
      if (S.turmaIdPorRot[r]) r += ' #' + t.idTurma;
      S.turmaRot[t.idTurma] = r; S.turmaIdPorRot[r] = t.idTurma;
      if (t.IdColacao != null) (porCol[t.IdColacao] = porCol[t.IdColacao] || []).push(r);
    });
    S.colRot = {};
    S.colacoes = (res[5].data || []).filter(function (c) { return porCol[c.idColacao]; }).map(function (c) {
      var l = porCol[c.idColacao], rot = (c.DataColacao ? dataBR(c.DataColacao) : 'sem data') + ' · ' + l.length + ' turma(s) · ' + l.slice(0, 2).join(', ') + (l.length > 2 ? '...' : '');
      S.colRot[c.idColacao] = rot; return { id: c.idColacao, rot: rot, data: c.DataColacao || '' };
    }).sort(function (a, b) { return String(b.data).localeCompare(String(a.data)); });
    S.base = true;
  }
  async function carregar() {
    var r = await Promise.all([todos('FormTarefa', '*', 'id'), todos('FormTarefaEtapaVw', '*', 'id')]);
    S.tarefas = {}; r[0].forEach(function (t) { S.tarefas[t.id] = t; });
    S.etapas = r[1];
  }
  function etapasDe(idT) { return S.etapas.filter(function (e) { return e.IdTarefa === idT; }).sort(function (a, b) { return a.Ordem - b.Ordem || a.id - b.id; }); }
  function posMax(setor) {
    var m = 0; S.etapas.forEach(function (e) { if (Number(e.IdSetor) === Number(setor) && e.Situacao === 'aberta' && Number(e.Posicao) > m) m = Number(e.Posicao); });
    return m;
  }
  function ctxTarefa(e) {
    var t = S.tarefas[e.IdTarefa]; if (!t) return '';
    var p = [];
    if (!t.Simples) { var l = etapasDe(t.id), i = l.findIndex(function (x) { return x.id === e.id; }); p.push(esc(t.Titulo) + ' · etapa ' + (i + 1) + ' de ' + l.length); }
    if (!ehDono(t)) p.push('de ' + esc(nomeSetor(t.IdSetorDono)));
    if (t.IdTurma && S.turmaRot[t.IdTurma]) p.push(esc(S.turmaRot[t.IdTurma]));
    else if (t.IdColacao && S.colRot[t.IdColacao]) p.push('Formatura ' + esc(S.colRot[t.IdColacao].split(' · ')[0]));
    if (e.Notas) p.push('📝 ' + esc(String(e.Notas).split('\n')[0].slice(0, 60)));
    return p.join(' · ');
  }

  // ---------- estrutura ----------
  TF.init = function (cfg) {
    C.raiz = cfg.raiz; C.setorId = cfg.setorId; C.admin = !!cfg.admin;
    if (!$('tfCss')) { var st = document.createElement('style'); st.id = 'tfCss'; st.textContent = CSS; document.head.appendChild(st); }
    if (!$('tfOv')) {
      var ov = document.createElement('div'); ov.id = 'tfOv'; ov.className = 'tf-ov';
      ov.addEventListener('mousedown', function (e) { if (e.target === ov) TF.fechar(); });
      document.body.appendChild(ov);
      var tt = document.createElement('div'); tt.id = 'tfToast'; tt.className = 'tf-toast'; document.body.appendChild(tt);
      var dl = document.createElement('datalist'); dl.id = 'tfTurmaOp'; document.body.appendChild(dl);
    }
    $(C.raiz).innerHTML = '<div class="tf" id="tfApp"></div>';
  };

  TF.abrir = async function (aba) {
    S.aba = aba || S.aba;
    if (S.aba === 'setores' && !C.admin) S.aba = 'fila';
    var app = $('tfApp'); if (!app) return;
    if (!S.base) app.innerHTML = '<p class="tf-vazio">Carregando...</p>';
    try { await carregarBase(); await carregar(); }
    catch (e) { app.innerHTML = '<p class="tf-vazio">Erro ao carregar: ' + esc(e.message || e) + '</p>'; return; }
    $('tfTurmaOp').innerHTML = Object.keys(S.turmaIdPorRot).sort().map(function (r) { return '<option value="' + esc(r) + '"></option>'; }).join('');
    render();
  };

  function render() {
    var app = $('tfApp'); if (!app) return;
    S.sel = {};
    var abas = [['fila', 'Minha fila'], ['acomp', 'Acompanhando']];
    if (C.admin) abas.push(['setores', 'Setores']);
    abas.push(['hist', 'Histórico']);
    var h = '<h1>Tarefas — ' + esc(nomeSetor(C.setorId)) + '</h1><div class="tf-sub0">Tarefas do dia a dia. Concluir manda para o histórico; ⤓ manda para o final da fila.</div>';
    h += '<div class="tf-abas">' + abas.map(function (a) { return '<button type="button" class="tf-aba' + (S.aba === a[0] ? ' on' : '') + '" onclick="TF.abrir(\'' + a[0] + '\')">' + a[1] + '</button>'; }).join('') + '</div>';
    if (S.aba === 'fila') h += htmlAdd();
    h += '<div id="tfCorpo">' + (S.aba === 'fila' ? htmlFila() : S.aba === 'acomp' ? htmlAcomp() : S.aba === 'setores' ? htmlSetores() : htmlHist()) + '</div>';
    app.innerHTML = h;
  }

  // ---------- adicionar ----------
  function optSetores(sel) { return S.setores.map(function (s) { return '<option value="' + s.idSetor + '"' + (Number(s.idSetor) === Number(sel) ? ' selected' : '') + '>' + esc(s.NomeSetor) + '</option>'; }).join(''); }
  function htmlAdd() {
    var h = '<div class="tf-add"><input type="text" id="tfNovoTit" placeholder="Nova tarefa..." onkeydown="if(event.key===\'Enter\')TF.criar()">' +
      '<div class="tf-modo"><button type="button" class="' + (S.modo === 'simples' ? 'on' : '') + '" onclick="TF.modo(\'simples\')">Simples</button><button type="button" class="' + (S.modo === 'etapas' ? 'on' : '') + '" onclick="TF.modo(\'etapas\')">Com etapas</button></div>' +
      '<button type="button" class="tf-btn" onclick="TF.criar()">+ Adicionar</button></div>';
    if (S.modo === 'simples') {
      h += '<button type="button" class="tf-lnk" onclick="TF.mais()">' + (S.maisAberto ? '− menos opções' : '+ mais opções (notas, turma, outro setor)') + '</button>';
      if (S.maisAberto) h += '<div class="tf-mais"><div><label>Notas / orientações</label><textarea id="tfNovoNotas"></textarea></div>' +
        '<div class="tf-row2"><div><label>Turma (opcional)</label>' + pickTurma('tfNovoTurma') + '</div>' +
        '<div><label>Formatura (opcional)</label><select id="tfNovoCol"><option value="">—</option>' + S.colacoes.map(function (c) { return '<option value="' + c.id + '">' + esc(c.rot) + '</option>'; }).join('') + '</select></div></div>' +
        '<div><label>Setor responsável</label><select id="tfNovoSetor">' + optSetores(C.setorId) + '</select></div></div>';
    }
    return h;
  }
  TF.modo = function (m) { var v = $('tfNovoTit') ? $('tfNovoTit').value : ''; S.modo = m; render(); if ($('tfNovoTit')) { $('tfNovoTit').value = v; $('tfNovoTit').focus(); } };
  TF.mais = function () { var v = $('tfNovoTit').value; S.maisAberto = !S.maisAberto; render(); $('tfNovoTit').value = v; };

  function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9\/]+/g, ' ').trim(); }
  function pickTurma(id) {
    return '<input type="text" id="' + id + '" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="Digite: univinte enfermagem 29/2" oninput="TF.buscaTurma(\'' + id + '\')"><div class="tf-sug" id="' + id + '_s"></div>';
  }
  TF.buscaTurma = function (id) {
    delete S.sel[id];
    var box = $(id + '_s'), q = norm($(id).value);
    if (!q) { box.innerHTML = ''; return; }
    var tokens = q.split(' ');
    if (!S.turmaNorm) { S.turmaNorm = {}; Object.keys(S.turmaRot).forEach(function (k) { S.turmaNorm[k] = norm(S.turmaRot[k]); }); }
    var achou = Object.keys(S.turmaRot).filter(function (k) { return tokens.every(function (t) { return S.turmaNorm[k].indexOf(t) >= 0; }); }).slice(0, 8);
    box.innerHTML = achou.length ? achou.map(function (k) { return '<button type="button" onclick="TF.escolheTurma(\'' + id + '\', ' + k + ')">' + esc(S.turmaRot[k]) + '</button>'; }).join('') : '<div class="tf-vazio" style="padding:8px">Nenhuma turma encontrada.</div>';
  };
  TF.escolheTurma = function (id, tid) { S.sel[id] = Number(tid); $(id).value = S.turmaRot[tid]; $(id + '_s').innerHTML = ''; };
  function turmaDoCampo(idCampo) {
    var el = $(idCampo); if (!el || !el.value.trim()) return null;
    return S.sel[idCampo] || -1;
  }
  TF.criar = async function () {
    var tit = $('tfNovoTit').value.trim();
    if (S.modo === 'etapas') { abrirDlgEtapas(tit); return; }
    if (!tit) { toast('Digite o título da tarefa.', true); $('tfNovoTit').focus(); return; }
    var notas = $('tfNovoNotas') ? $('tfNovoNotas').value.trim() || null : null;
    var idTurma = $('tfNovoTurma') ? turmaDoCampo('tfNovoTurma') : null;
    if (idTurma === -1) { toast('Toque na turma na lista de resultados.', true); return; }
    var idCol = $('tfNovoCol') && $('tfNovoCol').value ? Number($('tfNovoCol').value) : null;
    var setor = $('tfNovoSetor') ? Number($('tfNovoSetor').value) : C.setorId;
    try {
      var r = await db().from('FormTarefa').insert({ Titulo: tit, Notas: notas, IdSetorDono: C.setorId, IdTurma: idTurma, IdColacao: idCol, Simples: true }).select('id').single();
      if (r.error) throw r.error;
      var e = await db().from('FormTarefaEtapa').insert({ IdTarefa: r.data.id, Titulo: tit, Notas: notas, IdSetor: setor, Ordem: 1, JuntoComAnterior: false, Posicao: posMax(setor) + 1, CriadaPorSetor: C.setorId });
      if (e.error) { await db().from('FormTarefa').delete().eq('id', r.data.id); throw e.error; }

  // ---------- fila ----------
  function minhasAbertas() { return S.etapas.filter(function (e) { return Number(e.IdSetor) === Number(C.setorId) && e.Situacao === 'aberta'; }); }
  function htmlFila() {
    var ab = minhasAbertas();
    var lib = ab.filter(function (e) { return e.Liberada; }).sort(function (a, b) { return Number(a.Posicao) - Number(b.Posicao) || a.id - b.id; });
    var esp = ab.filter(function (e) { return !e.Liberada; });

    var feitas = S.etapas.filter(function (e) { return Number(e.IdSetor) === Number(C.setorId) && e.Situacao === 'concluida' && e.ConcluidaEm && diaLocal(e.ConcluidaEm) === hoje; }).length;

      return '<div class="tf-item"><span class="tf-circ" style="opacity:.3;cursor:default"></span><div class="tf-corpo" onclick="TF.detalhe(' + e.IdTarefa + ')"><div class="tf-tit" style="color:#6b7570">' + esc(e.Titulo) + '</div><div class="tf-sub">' + ctxTarefa(e) + '</div></div></div>';

  TF.concluir = async function (id, btn) {
    var item = btn && btn.closest('.tf-item'); if (item) item.classList.add('tf-feito');
    var r = await db().rpc('tarefa_concluir_etapa', { p_etapa: id });

  TF.final = async function (id) {
    var r = await db().from('FormTarefaEtapa').update({ Posicao: posMax(C.setorId) + 1 }).eq('id', id);

    await TF.abrir('fila');
  };
  TF.arrastar = function (ev) {
    ev.preventDefault();
    var alca = ev.target, lista = $('tfFilaLista'), item = alca.closest('.tf-item');
    if (!lista || !item) return;
    item.classList.add('tf-drag');
    function mover(e) {
      var outros = Array.prototype.slice.call(lista.querySelectorAll('.tf-item:not(.tf-drag)')), ref = null;
      for (var i = 0; i < outros.length; i++) { var r = outros[i].getBoundingClientRect(); if (e.clientY < r.top + r.height / 2) { ref = outros[i]; break; } }
      if (ref) lista.insertBefore(item, ref); else lista.appendChild(item);
      if (e.clientY > window.innerHeight - 60) window.scrollBy(0, 12); else if (e.clientY < 60) window.scrollBy(0, -12);
    }
    async function fim() {
      document.removeEventListener('pointermove', mover); document.removeEventListener('pointerup', fim); document.removeEventListener('pointercancel', fim);
      item.classList.remove('tf-drag');
      var ids = Array.prototype.slice.call(lista.querySelectorAll('.tf-item')).map(function (x) { return Number(x.dataset.id); });
      var upd = [];
      ids.forEach(function (id, i) { var e = S.etapas.find(function (x) { return x.id === id; }); if (e && Number(e.Posicao) !== i + 1) { e.Posicao = i + 1; upd.push(db().from('FormTarefaEtapa').update({ Posicao: i + 1 }).eq('id', id)); } });
      var rs = await Promise.all(upd);
      if (rs.some(function (r) { return r.error; })) toast('Não foi possível salvar a nova ordem.', true);
    }
    document.addEventListener('pointermove', mover); document.addEventListener('pointerup', fim); document.addEventListener('pointercancel', fim);
  };

  // ---------- acompanhando ----------
  function maesAcomp(acomp) {
    return Object.keys(S.tarefas).map(function (k) { return S.tarefas[k]; }).filter(function (t) {
      if (!ehDono(t) || t.Situacao !== 'aberta' || !!t.Acompanhando !== acomp) return false;
      return etapasDe(t.id).some(function (e) { return Number(e.IdSetor) !== Number(C.setorId); });
    }).sort(function (a, b) { return String(b.created_at).localeCompare(String(a.created_at)); });
  }
  function cardMae(t, comBotao) {
    var l = etapasDe(t.id), feitas = l.filter(function (e) { return e.Situacao === 'concluida'; }).length;
    var loc = t.IdTurma && S.turmaRot[t.IdTurma] ? S.turmaRot[t.IdTurma] : (t.IdColacao && S.colRot[t.IdColacao] ? 'Formatura ' + S.colRot[t.IdColacao].split(' · ')[0] : '');
    return '<div class="tf-card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div style="cursor:pointer" onclick="TF.detalhe(' + t.id + ')"><div class="tf-tit"><b>' + esc(t.Titulo) + '</b></div><div class="tf-sub">' + feitas + ' de ' + l.length + ' etapas' + (loc ? ' · ' + esc(loc) : '') + ' · criada há ' + dias(t.created_at) + 'd</div></div>' +
      comBotao + '</div><div class="tf-barra"><i style="width:' + (l.length ? Math.round(feitas * 100 / l.length) : 0) + '%"></i></div><div class="tf-passos">' +

  }
  function htmlAcomp() {

  TF.paradas = function () { S.verParadas = !S.verParadas; render(); };
  TF.acompanhar = async function (id, v) {

      '<div><button type="button" class="tf-btn2" onclick="TF.addEtapa()">Adicionar etapa</button></div></div>';
    if (dono) {
      h += '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;border-top:1px solid #dfe0da;padding-top:12px">' +
        '<button type="button" class="tf-btn2" onclick="TF.acompanhar(' + t.id + ', ' + (t.Acompanhando ? 'false' : 'true') + ')">' + (t.Acompanhando ? 'Parar de acompanhar' : 'Voltar a acompanhar') + '</button>' +
        '<button type="button" class="tf-btn2 perigo" onclick="TF.excluirTarefa()">Excluir tarefa</button></div>';
    } else h += '<p class="tf-sub" style="color:#8a928d;margin-top:14px">Somente ' + esc(nomeSetor(t.IdSetorDono)) + ' (quem criou) pode excluir esta tarefa.</p>';
    abrirOv(h);
  }
  TF.salvarNotasMae = async function () {
    var r = await db().from('FormTarefa').update({ Notas: $('tfMaeNotas').value.trim() || null }).eq('id', S.detalheId);
    if (r.error) { toast('Erro: ' + r.error.message, true); return; }
    toast('Notas salvas.'); await carregar(); render();
  };
  TF.editarEtapa = function (id) { S.edEtapa = id; renderDetalhe(); };
  TF.salvarEtapa = async function (id) {
    var tit = $('tfEdTit').value.trim(); if (!tit) { toast('O título não pode ficar vazio.', true); return; }
    var r = await db().from('FormTarefaEtapa').update({ Titulo: tit, Notas: $('tfEdNotas').value.trim() || null }).eq('id', id);
    if (r.error) { toast('Erro: ' + r.error.message, true); return; }
    S.edEtapa = null; await carregar(); renderDetalhe(); render();
  };
  TF.addEtapa = async function () {
    var tit = $('tfNeTit').value.trim(); if (!tit) { toast('Informe o que precisa ser feito.', true); return; }
    var setor = Number($('tfNeSetor').value), l = etapasDe(S.detalheId);
    var ordem = l.length ? Math.max.apply(null, l.map(function (e) { return e.Ordem; })) + 1 : 1;
    var r = await db().from('FormTarefaEtapa').insert({ IdTarefa: S.detalheId, Titulo: tit, Notas: $('tfNeNotas').value.trim() || null, IdSetor: setor, Ordem: ordem, JuntoComAnterior: l.length > 0 && $('tfNeJunto').checked, Posicao: posMax(setor) + 1, CriadaPorSetor: C.setorId });
    if (r.error) { toast('Erro: ' + r.error.message, true); return; }
    // se a tarefa estava concluída, volta a ficar aberta
    var t = S.tarefas[S.detalheId], up = {};
    if (t && t.Simples) up.Simples = false;
    if (t && t.Situacao === 'concluida') { up.Situacao = 'aberta'; up.ConcluidaEm = null; }
    if (t && Object.keys(up).length) await db().from('FormTarefa').update(up).eq('id', t.id);
    toast('Etapa adicionada.'); await carregar(); renderDetalhe(); render();
  };
  TF.excluirEtapa = async function (id) {
    if (!confirm('Excluir esta etapa?')) return;
    var r = await db().from('FormTarefaEtapa').delete().eq('id', id);
    if (r.error) { toast('Erro: ' + r.error.message, true); return; }
    await db().rpc('tarefa_verificar', { p_tarefa: S.detalheId });
    await carregar(); renderDetalhe(); render();
  };
  TF.excluirTarefa = async function () {
    if (!confirm('Excluir esta tarefa e todas as suas etapas? Isso não pode ser desfeito.')) return;
    var id = S.detalheId;
    var a = await db().from('FormTarefaEtapa').delete().eq('IdTarefa', id);
    if (a.error) { toast('Erro: ' + a.error.message, true); return; }
    var b = await db().from('FormTarefa').delete().eq('id', id);
    if (b.error) { toast('Erro: ' + b.error.message, true); return; }
    TF.fechar(); await TF.abrir(S.aba);
  };
})();

</script>

  // Setor Geral (id 5) = você. A página só mostra a sua fila, com acompanhamento e visão dos setores.
  TF.init({ raiz: 'tfRaiz', setorId: 5, admin: true });
  TF.abrir('fila');
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
</script>
